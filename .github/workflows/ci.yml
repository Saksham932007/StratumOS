# StratumOS continuous integration.
#
# The point of CI on an OS project is that "it builds" and "it boots" are
# different claims, and only one of them is cheap to verify by eye. Every push
# therefore boots the kernel - both ways - and asserts on what it says.
#
# Jobs are ordered cheapest-first so a trivial mistake fails in seconds rather
# than after a QEMU run:
#
#   1. host-tests    pure unit tests, no emulator        (~10 s)
#   2. build         cross-toolchain build + validation  (~1 min)
#   3. riscv64       the second architecture, built and booted (~1 min)
#   4. fuzz          libFuzzer over real kernel sources  (~2 min)
#   5. boot-tests    QEMU, twelve scenarios              (~9 min)
#   6. analysis      static analysis and style           (~1 min)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # --------------------------------------------------------------------------
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a 32-bit toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib libc6-dev-i386

      - name: Run the formatter and string tests
        run: make test-host

  # --------------------------------------------------------------------------
  build:
    name: Build kernel and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm gcc-multilib libc6-dev-i386 \
            grub-pc-bin grub-common xorriso mtools python3

      - name: Report the toolchain
        run: make toolchain

      - name: Build everything
        run: make all

      # check-kernel.py already ran as part of the link step; this prints its
      # findings so the log shows what was verified rather than only that it
      # passed.
      - name: Show what was validated
        run: make sections

      - name: Report code size
        run: make lines

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: stratumos-images
          path: |
            build/x86/stratum.elf
            build/x86/stratum.debug.elf
            build/x86/stratum.img
            build/x86/stratum.iso
          retention-days: 14
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The second architecture. Builds and boots the riscv64 kernel, and reports
  # how much of the rest of the kernel compiles for it - which is the number
  # docs/PORTING.md quotes, so it is generated on every push rather than
  # written down once.
  #
  # Needs no new compiler: clang cross-compiles to riscv64 out of the box and
  # ld.lld links it, which is most of why this port needed no toolchain work.
  riscv64:
    name: Second architecture (riscv64)
    runs-on: ubuntu-latest
    needs: [host-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang, lld and the riscv64 emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm python3 qemu-system-misc

      # One variable selects the architecture; the verbs are the same ones
      # the x86 job uses. See kernel/arch/<arch>/arch.mk.
      - name: Build for riscv64
        run: make ARCH=riscv64

      - name: Boot it and assert
        run: make ARCH=riscv64 test-boot

      # Informational, not a gate: a file that does not compile for a second
      # architecture is a finding to act on, not a build break. See
      # DESIGN-DECISIONS entry 35.
      - name: Measure portability
        run: make portability | tee portability.txt

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability
          path: portability.txt
          retention-days: 14
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # The four host fuzz targets compile the kernel's own parsers - ELF, FAT16,
  # the heap and ACPI - for the host under AddressSanitizer and libFuzzer. This
  # job is what keeps the five bugs they already found from coming back, and it
  # runs before the QEMU job because a sanitizer report is a far better
  # diagnosis than a triple fault.
  #
  # Bounded deliberately: 20,000 runs or 60 seconds per target, seeded from
  # inputs the build itself produces. A long campaign is something a developer
  # starts by hand; CI's job is to notice a regression, not to discover.
  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    needs: [host-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang with a 32-bit sanitizer runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm gcc-multilib libc6-dev-i386 mtools python3 \
            clang llvm

      # libFuzzer and ASan are clang runtime libraries, and the 32-bit copies
      # live in a separate package whose name carries the version. Resolve it
      # from the installed clang rather than pinning a number that will rot.
      - name: Install the 32-bit clang runtime
        run: |
          ver=$(clang --version | sed -n '1s/.*version \([0-9]*\).*/\1/p')
          sudo apt-get install -y -qq \
            "libclang-rt-$ver-dev" || \
            sudo apt-get install -y -qq libclang-rt-dev
          sudo apt-get install -y -qq lib32stdc++-13-dev || true

      - name: Fuzz
        run: make fuzz

      - name: Upload any crashes and the fuzzer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: |
            build/fuzz/*.log
            crash-*
            leak-*
            timeout-*
          retention-days: 14
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  boot-tests:
    name: Boot tests under QEMU
    runs-on: ubuntu-latest
    needs: [host-tests, build]
    steps:
      - uses: actions/checkout@v4

      - name: Install build and emulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm gcc-multilib libc6-dev-i386 \
            grub-pc-bin grub-common xorriso mtools \
            qemu-system-x86 python3

      - name: Build
        run: make all

      # Twelve scenarios: the custom bootloader from a raw disk, Multiboot2
      # via GRUB from an ISO, the same image on four processors, the same
      # image on a CPU that has SMEP and SMAP, the same image on a CPU that
      # has x86-64, the same image with an e1000 attached and with none at
      # all, the shell driven command by command over the serial console,
      # 40,000 malformed system calls issued from ring 3, the benchmark
      # image, and three faults that must panic and say why.
      #
      # Eleven assert on the kernel's own output and its exit status. The
      # `network` one does not: it has QEMU dump every frame to a pcap and
      # parses the bytes, because the driver's first real bug was invisible
      # in the log. See docs/NETWORK.md.
      #
      # The x86-64 one runs under qemu-system-x86_64 rather than
      # qemu-system-i386: the i386 target masks CPUID.80000001H:EDX.LM even
      # with -cpu max, so long mode is undetectable there. The qemu-system-x86
      # package installed above provides both binaries.
      - name: Boot and assert
        run: python3 tools/run-tests.py --build-dir build/x86 --keep-logs logs

      - name: Upload the serial transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  analysis:
    name: Static analysis and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm gcc-multilib libc6-dev-i386 \
            cppcheck clang-format clang-tools python3

      - name: clang-format
        run: make format-check

      # cppcheck is run in advisory mode. A kernel legitimately does things
      # that look alarming out of context - fixed-address volatile pointers,
      # inline assembly with register constraints - so this informs rather
      # than gates.
      - name: cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr --std=c11 --platform=unix32 \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedStructMember \
                   -I kernel/include kernel/ 2>&1 | tee cppcheck.txt

      - name: GCC analyzer
        continue-on-error: true
        run: |
          make clean
          make kernel CFLAGS_EXTRA=-fanalyzer 2>&1 | tee analyzer.txt || true

      - name: Upload analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: |
            cppcheck.txt
            analyzer.txt
          retention-days: 7
          if-no-files-found: ignore
