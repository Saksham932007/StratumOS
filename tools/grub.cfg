# GRUB configuration for the StratumOS rescue ISO.
#
# `multiboot2` rather than `multiboot`: the kernel declares a Multiboot2
# header and the two protocols pass information in incompatible ways, so
# loading a Multiboot2 kernel with the v1 command gives a kernel that boots
# and then cannot find its memory map.

set timeout=2
set default=0

menuentry "StratumOS" {
    multiboot2 /boot/stratum.elf
    boot
}

menuentry "StratumOS (self-test, then shut down)" {
    multiboot2 /boot/stratum.elf autotest nodemo
    boot
}

menuentry "StratumOS (serial console only)" {
    multiboot2 /boot/stratum.elf quiet loglevel=debug
    boot
}
